{% extends "base.html" %}

{% block content %}
<div class="glass-card" style="max-width: 450px; margin: 0 auto;">
    <h2 class="text-center mb-2" style="color: var(--primary-color);">Iniciar Sesión</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label class="form-label" for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p class="text-center mt-2">
        ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--secondary-color); font-weight: 600;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
