{% extends "base.html" %}

{% block content %}
<div class="glass-card" style="max-width: 450px; margin: 0 auto;">
    <h2 class="text-center mb-2" style="color: var(--primary-color);">Crear Cuenta</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label class="form-label" for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Juan Pérez">
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-secondary btn-block">Registrarse</button>
    </form>
    <p class="text-center mt-2">
        ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--primary-color); font-weight: 600;">Inicia sesión</a>
    </p>
</div>
{% endblock %}
